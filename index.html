<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewsSparkle — Breaking News, Politics, Business, Tech, Health &amp; Entertainment</title>
    <meta name="description" content="Your daily briefing on what matters — breaking news, politics, tech, business, health and entertainment. Handpicked, fact-checked, and refreshingly readable.">
    <meta name="author" content="NewsSparkle Editorial Desk" />
    <meta name="theme-color" content="#faf8f4" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://newssparkle.lovable.app/" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NewsSparkle" />
    <meta property="og:url" content="https://newssparkle.lovable.app/" />
    <meta property="og:image" content="https://newssparkle.lovable.app/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NewsSparkle — breaking news, politics, business, technology, health and entertainment." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@newssparkle" />
    <meta name="twitter:image" content="https://newssparkle.lovable.app/og-default.jpg" />

    <!-- DNS prefetch / preconnect for the only third-party origin we load up front -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsMediaOrganization",
      "name": "NewsSparkle",
      "url": "https://newssparkle.lovable.app",
      "logo": {
        "@type": "ImageObject",
        "url": "https://newssparkle.lovable.app/logo.png",
        "width": 512,
        "height": 512
      },
      "description": "Independent digital news publication delivering fact-checked stories daily across six sections.",
      "sameAs": ["https://twitter.com/newssparkle"]
    }
    </script>
